<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-label="Anderson Melo — Estudante de TI e desenvolvedor Java em formação">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#a78bfa" stop-opacity=".25"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity=".08"/>
    </pattern>
  </defs>
  <style>
    .w1 { animation: slide1 16s linear infinite; }
    .w2 { animation: slide2 11s linear infinite; }
    .w3 { animation: slide3 22s linear infinite; }
    .fade { animation: fade 1.4s ease-out both; }
    .fade2 { animation: fade 1.4s ease-out .35s both; }
    @keyframes slide1 { from { transform: translateX(0); } to { transform: translateX(-600px); } }
    @keyframes slide2 { from { transform: translateX(-400px); } to { transform: translateX(0); } }
    @keyframes slide3 { from { transform: translateX(0); } to { transform: translateX(-800px); } }
    @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g class="w3"><path d="M0 212 Q 200.0 184 400.0 212 T 800 212 T 1200 212 T 1600 212 T 2000 212 T 2400 212 L 2400 0 L 0 0 Z" fill="#7c3aed" fill-opacity=".35"/></g>
  <g class="w2"><path d="M0 200 Q 100.0 168 200.0 200 T 400 200 T 600 200 T 800 200 T 1000 200 T 1200 200 T 1400 200 T 1600 200 T 1800 200 T 2000 200 T 2200 200 T 2400 200 L 2400 0 L 0 0 Z" fill="#8b5cf6" fill-opacity=".6"/></g>
  <g class="w1"><path d="M0 186 Q 150.0 150 300.0 186 T 600 186 T 900 186 T 1200 186 T 1500 186 T 1800 186 T 2100 186 T 2400 186 L 2400 0 L 0 0 Z" fill="url(#bg)"/></g>
  <rect width="1200" height="160" fill="url(#dots)"/>
  <ellipse cx="980" cy="30" rx="340" ry="128" fill="url(#glow)"/>
  <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" text-anchor="middle">
    <text class="fade" x="600" y="98" font-size="62" font-weight="700" fill="#ffffff" letter-spacing="1">Anderson Melo</text>
    <text class="fade2" x="600" y="140" font-size="22" font-weight="500" fill="#ddd6fe" letter-spacing=".5">Estudante de TI  •  Desenvolvedor Java em formação</text>
  </g>
</svg>
