<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120" role="img" aria-label="Rodapé">
  <defs>
    <linearGradient id="bg" x1="0" y1="20" x2="0" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6d28d9"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>
  <style>
    .w1 { animation: slide1 16s linear infinite; }
    .w2 { animation: slide2 11s linear infinite; }
    .w3 { animation: slide3 22s linear infinite; }
    .fade { animation: fade 1.4s ease-out both; }
    .fade2 { animation: fade 1.4s ease-out .35s both; }
    @keyframes slide1 { from { transform: translateX(0); } to { transform: translateX(-600px); } }
    @keyframes slide2 { from { transform: translateX(-400px); } to { transform: translateX(0); } }
    @keyframes slide3 { from { transform: translateX(0); } to { transform: translateX(-800px); } }
    @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g class="w3"><path d="M0 30 Q 200.0 6 400.0 30 T 800 30 T 1200 30 T 1600 30 T 2000 30 T 2400 30 L 2400 120 L 0 120 Z" fill="#7c3aed" fill-opacity=".35"/></g>
  <g class="w2"><path d="M0 40 Q 100.0 12 200.0 40 T 400 40 T 600 40 T 800 40 T 1000 40 T 1200 40 T 1400 40 T 1600 40 T 1800 40 T 2000 40 T 2200 40 T 2400 40 L 2400 120 L 0 120 Z" fill="#8b5cf6" fill-opacity=".6"/></g>
  <g class="w1"><path d="M0 52 Q 150.0 20 300.0 52 T 600 52 T 900 52 T 1200 52 T 1500 52 T 1800 52 T 2100 52 T 2400 52 L 2400 120 L 0 120 Z" fill="url(#bg)"/></g>
</svg>
