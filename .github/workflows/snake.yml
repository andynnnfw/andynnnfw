name: generate snake and stats

on:
  # roda a cada 6 horas
  schedule:
    - cron: "0 */6 * * *"
  # permite rodar manualmente pela aba Actions
  workflow_dispatch:
  # roda também sempre que você atualizar o repositório do perfil
  push:
    branches: [main, master]

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: gerar a cobrinha a partir do gráfico de contribuições
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#a78bfa

      - name: gerar o card de estatísticas
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&hide_border=true&bg_color=0d1117&title_color=a78bfa&icon_color=a78bfa&text_color=c9d1d9&rank_icon=github"
          path: dist/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: gerar o card de ofensiva (streak)
        env:
          GH_TOKEN: ${{ secrets.STREAK_TOKEN || secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: |
          if ! python3 - dist/streak.svg <<'PY'
          import datetime as dt
          import json
          import os
          import sys
          import urllib.request
          from zoneinfo import ZoneInfo

          LOGIN = os.environ.get("GH_LOGIN", "")
          TOKEN = os.environ.get("GH_TOKEN", "")
          TZ = os.environ.get("STREAK_TZ", "America/Sao_Paulo")
          OUT = sys.argv[1] if len(sys.argv) > 1 else "dist/streak.svg"

          QUERY_YEAR = """
          query($login: String!, $from: DateTime!, $to: DateTime!) {
            user(login: $login) {
              id
              contributionsCollection(from: $from, to: $to) {
                contributionYears
                contributionCalendar { weeks { contributionDays { date contributionCount } } }
                commitContributionsByRepository(maxRepositories: 100) {
                  repository { name owner { login } }
                  contributions(first: 100) { nodes { occurredAt commitCount } }
                }
                issueContributions(first: 100) { nodes { occurredAt } }
                pullRequestContributions(first: 100) { nodes { occurredAt } }
                pullRequestReviewContributions(first: 100) { nodes { occurredAt } }
                repositoryContributions(first: 100) { nodes { occurredAt } }
              }
            }
          }
          """

          QUERY_HISTORY = """
          query($owner: String!, $name: String!, $author: ID!, $since: GitTimestamp!, $until: GitTimestamp!, $after: String) {
            repository(owner: $owner, name: $name) {
              defaultBranchRef { target { ... on Commit {
                history(first: 100, after: $after, author: {id: $author}, since: $since, until: $until) {
                  pageInfo { hasNextPage endCursor }
                  nodes { authoredDate }
                }
              } } }
            }
          }
          """


          def gql(query, variables):
              req = urllib.request.Request(
                  "https://api.github.com/graphql",
                  data=json.dumps({"query": query, "variables": variables}).encode(),
                  headers={"Authorization": f"bearer {TOKEN}", "Content-Type": "application/json"},
              )
              with urllib.request.urlopen(req, timeout=30) as r:
                  data = json.load(r)
              if "errors" in data:
                  raise RuntimeError(data["errors"])
              return data["data"]


          def parse_ts(s):
              return dt.datetime.fromisoformat(s.replace("Z", "+00:00"))


          def commit_times(owner, name, author, since, until):
              times, after = [], None
              for _ in range(10):
                  data = gql(QUERY_HISTORY, {"owner": owner, "name": name, "author": author, "since": since, "until": until, "after": after})
                  ref = (data.get("repository") or {}).get("defaultBranchRef")
                  if not ref:
                      break
                  hist = ref["target"]["history"]
                  times += [parse_ts(n["authoredDate"]) for n in hist["nodes"]]
                  if not hist["pageInfo"]["hasNextPage"]:
                      break
                  after = hist["pageInfo"]["endCursor"]
              return times


          def local_times(user_id, coll, since, until):
              # exact time of each contribution, to know on which Brasilia day it happened
              times = []
              for key in ("issueContributions", "pullRequestContributions", "pullRequestReviewContributions", "repositoryContributions"):
                  times += [parse_ts(n["occurredAt"]) for n in coll[key]["nodes"]]
              for repo in coll["commitContributionsByRepository"]:
                  try:
                      times += commit_times(repo["repository"]["owner"]["login"], repo["repository"]["name"], user_id, since, until)
                  except Exception as e:
                      print("skip repo", repo["repository"]["name"], e)
              return times


          def fetch_days():
              now_utc = dt.datetime.now(dt.timezone.utc)
              today = dt.datetime.now(ZoneInfo(TZ)).date()
              now_s = now_utc.strftime("%Y-%m-%dT%H:%M:%SZ")
              first = gql(QUERY_YEAR, {"login": LOGIN, "from": f"{now_utc.year}-01-01T00:00:00Z", "to": now_s})["user"]
              user_id = first["id"]
              days, colls = {}, []
              for year in sorted(first["contributionsCollection"]["contributionYears"]):
                  since, until = f"{year}-01-01T00:00:00Z", (now_s if year == now_utc.year else f"{year}-12-31T23:59:59Z")
                  coll = first["contributionsCollection"] if year == now_utc.year else gql(QUERY_YEAR, {"login": LOGIN, "from": since, "to": until})["user"]["contributionsCollection"]
                  for week in coll["contributionCalendar"]["weeks"]:
                      for d in week["contributionDays"]:
                          days[dt.date.fromisoformat(d["date"])] = d["contributionCount"]
                  colls.append((coll, since, until))
              days = {d: c for d, c in days.items() if d <= today}
              total = sum(days.values())
              # a day is active if it had contributions in UTC (GitHub API) or in Brasilia time
              active = {d for d, c in days.items() if c > 0}
              for coll, since, until in colls:
                  try:
                      times = local_times(user_id, coll, since, until)
                      print("recent:", sorted(t.isoformat() for t in times if t > now_utc - dt.timedelta(days=4)))
                      for t in times:
                          ld = t.astimezone(ZoneInfo(TZ)).date()
                          if ld <= today:
                              active.add(ld)
                  except Exception as e:
                      print("could not read local times:", e)
              print("active last days:", sorted(str(d) for d in active)[-6:])
              return active, today, total


          def compute(active, today, total):
              dates = sorted(active)
              first_day = dates[0] if dates else today

              longest = (0, None, None)
              run_start, run_len, prev = None, 0, None
              for d in dates:
                  if prev is not None and (d - prev).days == 1:
                      run_len += 1
                  else:
                      run_start, run_len = d, 1
                  if run_len > longest[0]:
                      longest = (run_len, run_start, d)
                  prev = d

              # current streak: today may still be empty without breaking the streak
              day = today if today in active else today - dt.timedelta(days=1)
              cur_end, cur_len = day, 0
              while day in active:
                  cur_len += 1
                  day -= dt.timedelta(days=1)
              cur_start = day + dt.timedelta(days=1)
              current = (cur_len, cur_start if cur_len else today, cur_end if cur_len else today)
              return total, first_day, current, longest


          def fmt(d, today, force_year=False):
              s = f"{d.strftime('%b')} {d.day}"
              if force_year or d.year != today.year:
                  s += f", {d.year}"
              return s


          def rng(a, b, today):
              if a is None:
                  return ""
              if a == b:
                  return fmt(a, today)
              return f"{fmt(a, today)} - {fmt(b, today)}"


          def render(total, first_day, current, longest, today):
              total_range = f"{fmt(first_day, today, force_year=True)} - Present"
              cur_range = rng(current[1], current[2], today) if current[0] else fmt(today, today)
              long_range = rng(longest[1], longest[2], today) if longest[0] else ""
              font = "'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif"
              return f"""<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" role="img" aria-label="Total contributions {total}, current streak {current[0]}, longest streak {longest[0]}">
            <style>
              .num {{ font: 700 28px {font}; fill: #ffffff; }}
              .lbl {{ font: 400 14px {font}; fill: #c9d1d9; }}
              .cur {{ font: 700 14px {font}; fill: #a78bfa; }}
              .date {{ font: 400 12px {font}; fill: #8b949e; }}
              .fade {{ opacity: 0; animation: fade 0.6s ease-in-out forwards; }}
              @keyframes fade {{ from {{ opacity: 0; }} to {{ opacity: 1; }} }}
            </style>
            <rect width="495" height="195" rx="4.5" fill="#0d1117"/>
            <line x1="165" y1="28" x2="165" y2="170" stroke="#e4e2e2" stroke-opacity="0.6" stroke-width="1"/>
            <line x1="330" y1="28" x2="330" y2="170" stroke="#e4e2e2" stroke-opacity="0.6" stroke-width="1"/>
            <g text-anchor="middle">
              <g class="fade" style="animation-delay:0.2s">
                <text class="num" x="82.5" y="79">{total}</text>
                <text class="lbl" x="82.5" y="115">Total Contributions</text>
                <text class="date" x="82.5" y="145">{total_range}</text>
              </g>
              <circle cx="247.5" cy="71" r="40" fill="none" stroke="#a78bfa" stroke-width="5"/>
              <rect x="232" y="22" width="31" height="18" fill="#0d1117"/>
              <path transform="translate(237 17) scale(0.85)" fill="#a78bfa" d="M12.6 0.6C13.3 5 11.1 7.4 9.3 9.6 7.6 11.7 6 13.7 6 17.2 6 21.5 9 24 12.2 24 16.1 24 19 21.2 19 16.9 19 13.9 17.7 11.4 15.8 9.4 16.2 11.7 15.4 13.5 13.9 14.6 14.4 11.1 14.3 6.2 12.6 0.6Z"/>
              <g class="fade" style="animation-delay:0.4s">
                <text class="num" x="247.5" y="81">{current[0]}</text>
              </g>
              <g class="fade" style="animation-delay:0.6s">
                <text class="cur" x="247.5" y="140">Current Streak</text>
                <text class="date" x="247.5" y="165">{cur_range}</text>
              </g>
              <g class="fade" style="animation-delay:0.8s">
                <text class="num" x="412.5" y="79">{longest[0]}</text>
                <text class="lbl" x="412.5" y="115">Longest Streak</text>
                <text class="date" x="412.5" y="145">{long_range}</text>
              </g>
            </g>
          </svg>
          """


          if __name__ == "__main__":
              active, today, total = fetch_days()
              total, first_day, current, longest = compute(active, today, total)
              os.makedirs(os.path.dirname(OUT) or ".", exist_ok=True)
              with open(OUT, "w", encoding="utf-8") as f:
                  f.write(render(total, first_day, current, longest, today))
              print(f"total={total} current={current[0]} longest={longest[0]}")
          PY
          then
            echo "nao foi possivel gerar o card de ofensiva, mantendo o anterior"
            curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/output/streak.svg" -o dist/streak.svg || true
          fi

      - name: publicar os SVGs na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
