name: generate snake

on:
  # roda todo dia à meia-noite (horário de Brasília)
  schedule:
    - cron: "0 3 * * *"
  # permite rodar manualmente pela aba Actions
  workflow_dispatch:
  # roda também sempre que você atualizar o repositório do perfil
  push:
    branches: [main, master]

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: gerar a cobrinha a partir do gráfico de contribuições
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#a78bfa

      - name: publicar os SVGs na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
